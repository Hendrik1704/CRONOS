# pytest.ini - CRONOS Testing Configuration
[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings
    --durations=10
minversion = 6.0
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    physics: marks tests for physics modules
    checkpoint: marks tests for checkpoint functionality
    memory: marks tests for memory monitoring
    configuration: marks tests for configuration system
